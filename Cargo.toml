[package]
name = "tshell"
version = "0.1.2"
edition = "2024"
description = "A native Rust terminal workspace"
license = "Apache-2.0"
autobins = false
default-run = "tshell"

[[bin]]
name = "tshell"
path = "src/main.rs"

[features]
ui-check-screenshots = ["gpui-kit/test-support"]

[dependencies]
async-channel = "2"
base64 = "=0.22.1"
gpui-kit = { version = "=0.6.1", features = [
    "profiler",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html5ever = "=0.27.0"
markup5ever_rcdom = "=0.3.0"
dirs = "6"
parking_lot = "0.12"
russh-sftp = "=3.0.0"
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
shell-words = "=1.1.1"
regex = "=1.13.1"
url = "=2.5.8"
similar = "=2.7.0"
percent-encoding = "=2.3.2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-i18n = { version = "4.2.2", default-features = false, features = ["load-path"] }
sys-locale = "0.3.2"
sha2 = "=0.11.0"
semver = "1"
hex = "=0.4.3"

[profile.dev]
debug = 0
incremental = true

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.7.3"
libloading = "=0.8.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
winreg = "=0.55.0"
wry = { version = "=0.57.0", default-features = false, features = ["os-webview"] }

[target.'cfg(not(windows))'.dependencies]
notify-rust = "=4.18.0"

[build-dependencies]
embed-resource = "=3.0.11"

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
